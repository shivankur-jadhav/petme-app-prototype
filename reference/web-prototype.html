<title>PetMe Tank Care</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a single mobile app column (max 560px) with a fixed bottom dock, after the Stitch "Oceanic Telemetry Console" system. Deliberately dark-only. */
:root {
  color-scheme: dark;
  --bg: #061426;
  --s-low: #0e1c2f;
  --s: #132033;
  --s-high: #1d2a3e;
  --s-top: #28354a;
  --ink: #d6e3fe;
  --ink-2: #bacac9;
  --muted: #94A3B8;
  --faint: #64748B;
  --line: rgba(56, 189, 248, 0.16);
  --line-2: rgba(148, 163, 184, 0.2);
  --hair: rgba(255, 255, 255, 0.06);
  --primary: #00D2D3;
  --primary-hi: #48efef;
  --on-primary: #061426;
  --primary-tint: rgba(0, 210, 211, 0.1);
  --tertiary: #38BDF8;
  --tert-tint: rgba(56, 189, 248, 0.12);
  --glass: rgba(30, 62, 98, 0.25);
  --glass-2: rgba(30, 62, 98, 0.5);
  --ok: #10B981;
  --warn: #F59E0B;
  --crit: #F43F5E;
  --head: "Space Grotesk", "Avenir Next", system-ui, sans-serif;
  --body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(92px + env(safe-area-inset-bottom, 0px));
}
.app { max-width: 560px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--head); margin: 0; text-wrap: balance; }
h1 { font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em; }
h2 { font-size: 19px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em; }
h3 { font-size: 16px; line-height: 22px; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lbl.cy { color: var(--primary); }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 16px; height: 16px; }

/* app bar */
.appbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--primary); font-family: var(--head); font-weight: 700; font-size: 19px; }
.brand .mark { width: 32px; height: 32px; border-radius: 6px; background: var(--s-high); border: 1px solid var(--line); display: grid; place-items: center; color: var(--primary); }
.brand small { display: flex; align-items: center; gap: 5px; font-family: var(--body); font-weight: 500; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }
.avatar { width: 36px; height: 36px; border-radius: 8px; background: var(--s-top); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--head); font-weight: 600; color: var(--ink); position: relative; }
.avatar::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--tertiary); border: 2px solid var(--bg); }

/* panels */
.view { display: grid; gap: 16px; padding-top: 6px; }
.panel { background: var(--glass); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel.flat { background: var(--s-low); }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sec-h h2 { display: flex; align-items: center; gap: 8px; }
.sec-h h2 .ic { color: var(--primary); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--primary-tint); color: var(--primary); white-space: nowrap; font-family: var(--body); }
.badge.ok { color: var(--ok); background: rgba(16,185,129,.1); border-color: rgba(16,185,129,.35); }
.badge.warn { color: var(--warn); background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.35); }
.badge.crit { color: var(--crit); background: rgba(244,63,94,.1); border-color: rgba(244,63,94,.35); }
.badge.slate { color: var(--muted); background: rgba(148,163,184,.08); border-color: var(--line-2); }
.badge.tert { color: var(--tertiary); background: var(--tert-tint); border-color: rgba(56,189,248,.35); }
.badge.dash { background: transparent; border-style: dashed; color: var(--muted); border-color: var(--line-2); }
.fine { font-size: 12px; color: var(--muted); }
.err { color: var(--crit); font-size: 13px; min-height: 1em; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--primary); background: var(--primary); color: var(--on-primary); border-radius: 4px; padding: 12px 16px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 14px; }
.btn:hover { box-shadow: 0 0 0 3px rgba(0,210,211,.15), 0 8px 24px rgba(0,210,211,.15); }
.btn:disabled { opacity: .5; cursor: default; box-shadow: none; }
.btn.sec { background: transparent; color: var(--primary); border-color: rgba(0,210,211,.4); }
.btn.sec:hover { background: var(--primary-tint); box-shadow: none; }
.btn.ghost { background: var(--s-high); color: var(--primary); border-color: transparent; }
.btn.danger { background: rgba(244,63,94,.08); color: var(--crit); border-color: rgba(244,63,94,.5); }
.btn.plain { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.sm { padding: 7px 11px; font-size: 13px; }
.btn.block { width: 100%; }

/* tank hero */
.hero { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--s-low); }
.tankart { position: relative; aspect-ratio: 5 / 2; max-width: 100%; background: linear-gradient(180deg, #0c3a57 0%, #082a42 55%, #061f33 100%); }
.tankart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tankart .tags { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 8px; }
.tankart .tags .badge { background: rgba(6,20,38,.7); }
.hero-body { padding: 14px 16px 16px; display: grid; gap: 4px; }
.hero-body h1 { font-size: 24px; line-height: 30px; }
.hero-sub { color: var(--muted); font-size: 13px; }
.hero-row { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
.hero-row b { color: var(--tertiary); font-weight: 500; }

/* metrics */
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { background: var(--s); border: 1px solid var(--hair); border-radius: 8px; padding: 12px; display: grid; gap: 6px; min-width: 0; }
.metric-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; }
.metric-top .badge { padding: 3px 6px; }
.metric-val { font-family: var(--head); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.metric-val.ok { color: var(--primary-hi); }
.metric-val.warn { color: var(--warn); }
.metric-val.crit { color: var(--crit); }
.metric-val small { font-family: var(--body); font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.metric .tgt { font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* lists */
.rowlist { display: grid; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--hair); min-width: 0; }
.item:first-child { border-top: 0; }
.thumb { width: 52px; height: 52px; border-radius: 6px; background: var(--s-high); display: grid; place-items: center; flex: none; border: 1px solid var(--hair); }
.thumb svg { width: 40px; height: 28px; }
.item-main { flex: 1; min-width: 0; display: grid; gap: 1px; }
.item-main b { font-family: var(--head); font-weight: 600; font-size: 15px; }
.item-main span { font-size: 12px; color: var(--muted); }
.item-side { display: grid; justify-items: end; gap: 4px; text-align: right; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chips button { flex: none; border: 1px solid var(--line-2); background: var(--s-low); color: var(--ink-2); border-radius: 4px; padding: 7px 13px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.chips button[aria-pressed="true"] { background: var(--tertiary); color: var(--on-primary); border-color: var(--tertiary); font-weight: 600; }

/* booking */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--bg); border: 1px solid var(--line-2); border-radius: 6px; padding: 3px; gap: 3px; }
.seg label { position: relative; display: block; text-align: center; padding: 8px 4px; border-radius: 4px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); min-width: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--glass-2); box-shadow: 0 0 0 1px rgba(0,210,211,.45) inset; color: var(--ink); font-weight: 600; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 1px; }
.seg small { display: block; font-size: 10px; color: var(--muted); font-weight: 400; }
.svc { position: relative; display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--glass); cursor: pointer; }
.svc input { position: absolute; opacity: 0; pointer-events: none; }
.svc:has(input:checked) { border-color: var(--primary); background: rgba(30,62,98,.45); box-shadow: 0 8px 32px rgba(0,210,211,.08); }
.svc:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }
.svc-top { display: flex; align-items: flex-start; gap: 10px; }
.svc-top .ic { color: var(--tertiary); margin-top: 2px; }
.svc-name { flex: 1; min-width: 0; }
.svc-name b { font-family: var(--head); font-size: 16px; font-weight: 600; display: block; }
.svc-name span { font-size: 11px; color: var(--muted); }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--outline, #3b4949); background: var(--s-top); display: grid; place-items: center; flex: none; }
.svc:has(input:checked) .radio { background: var(--tertiary); border-color: var(--tertiary); color: var(--on-primary); }
.radio .ic { width: 13px; height: 13px; stroke-width: 3; opacity: 0; color: var(--on-primary); margin: 0; }
.svc:has(input:checked) .radio .ic { opacity: 1; }
.svc p { font-size: 13px; color: var(--ink-2); }
.svc-foot { display: flex; justify-content: space-between; align-items: center; background: var(--bg); border-radius: 4px; padding: 8px 10px; }
.svc-foot .dur { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.svc-foot .price { font-family: var(--head); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
.day { position: relative; flex: none; width: 58px; text-align: center; border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 0 7px; background: var(--s-low); cursor: pointer; display: grid; gap: 2px; }
.day input { position: absolute; opacity: 0; pointer-events: none; }
.day .dw { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.day .dn { font-family: var(--head); font-size: 20px; font-weight: 600; }
.day .dm { font-size: 10px; color: var(--muted); }
.day:has(input:checked) { background: var(--secondary, #1E3E62); border-color: var(--primary); }
.day:has(input:checked) .dw { color: var(--primary); }
.day:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 1px; }
.wins { display: grid; gap: 8px; }
.win { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--s-low); cursor: pointer; }
.win input { position: absolute; opacity: 0; pointer-events: none; }
.win .ic { color: var(--tertiary); }
.win b { font-family: var(--head); font-weight: 600; font-size: 15px; display: block; }
.win span { font-size: 11px; color: var(--muted); }
.win > div { flex: 1; min-width: 0; }
.win:has(input:checked) { border-color: var(--primary); background: rgba(30,62,98,.4); }
.win:has(input:checked) .radio { background: var(--tertiary); border-color: var(--tertiary); }
.win:has(input:checked) .radio .ic { opacity: 1; }
.win:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: 12px; font-weight: 500; color: var(--ink-2); }
.two { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
input[type=text], input[type=tel], input[type=number], input[type=email], select, textarea {
  width: 100%; min-width: 0; background: rgba(11,25,44,.6); border: 1px solid var(--line-2); border-radius: 4px; padding: 10px 12px; color: #F8FAFC;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
::placeholder { color: var(--faint); }
textarea { min-height: 84px; resize: vertical; }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--hair); cursor: pointer; font-size: 13px; }
.check input { width: 16px; height: 16px; accent-color: var(--primary); flex: none; }
.ledger { display: grid; gap: 7px; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.ledger .r { display: flex; justify-content: space-between; gap: 10px; }
.ledger .r.disc { color: var(--tertiary); }
.ledger .tot { border-top: 1px solid var(--hair); margin-top: 6px; padding-top: 12px; display: flex; align-items: end; justify-content: space-between; gap: 10px; font-family: var(--body); }
.ledger .tot b { font-family: var(--head); font-size: 15px; display: block; }
.ledger .tot span { font-size: 11px; color: var(--muted); }
.ledger .tot .amt { font-family: var(--mono); font-size: 26px; font-weight: 600; color: var(--ink); }
.wish { display: flex; flex-wrap: wrap; gap: 6px; }

/* history + report */
.job { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--glass); min-width: 0; }
button.job { text-align: left; cursor: pointer; width: 100%; color: inherit; }
button.job:hover { border-color: rgba(0,210,211,.45); }
.job-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; }
.job-head h3 { margin-right: auto; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; font-size: 13px; }
.kv span { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kv div { min-width: 0; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--hair); border-radius: 6px; overflow: hidden; }
.tile { padding: 10px; border-right: 1px solid var(--hair); min-width: 0; display: grid; gap: 3px; }
.tile:last-child { border-right: 0; }
.tile b { font-family: var(--head); font-size: 17px; font-variant-numeric: tabular-nums; }
.tile small { font-size: 11px; color: var(--muted); }
.task { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--hair); }
.task:first-child { border-top: 0; }
.tick { width: 20px; height: 20px; border-radius: 4px; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex: none; }
.tick.on { background: var(--tertiary); border-color: var(--tertiary); color: var(--on-primary); }
.tick .ic { width: 14px; height: 14px; stroke-width: 3; }
.task b { font-family: var(--head); font-weight: 600; font-size: 14px; }
.quote { border-left: 2px solid var(--primary); padding: 2px 0 2px 12px; font-size: 14px; color: var(--ink); overflow-wrap: anywhere; }
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--primary); cursor: pointer; padding: 4px 0; font-weight: 500; }

/* livestock recs */
.rec { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--glass); }
.rec-top { display: flex; gap: 12px; }
.rec-top .thumb { width: 84px; height: 84px; }
.rec-top .thumb svg { width: 60px; height: 40px; }
.rec-top > div { min-width: 0; flex: 1; display: grid; gap: 2px; align-content: start; }
.sci { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rec h3 { font-size: 18px; }
.rec p { font-size: 13px; color: var(--ink-2); }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }

/* pro */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--s); border: 1px solid var(--hair); border-radius: 8px; padding: 12px; min-width: 0; }
.stat b { display: block; font-family: var(--head); font-size: 22px; font-variant-numeric: tabular-nums; color: var(--primary-hi); }
.stat span { font-size: 11px; color: var(--muted); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.acts .money { margin-right: auto; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.acts .money b { color: var(--ink); font-weight: 600; }
.complete { display: grid; gap: 10px; border-top: 1px solid var(--hair); padding-top: 12px; }
.readings { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.empty { border: 1px dashed var(--line-2); border-radius: 8px; padding: 22px 16px; display: grid; gap: 10px; justify-items: start; }
.empty p { color: var(--muted); }
.note { font-size: 13px; background: var(--bg); border-radius: 4px; padding: 8px 10px; overflow-wrap: anywhere; color: var(--ink-2); }

/* dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(6,20,38,.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.dock nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.dock a { display: grid; justify-items: center; gap: 3px; padding: 6px 2px; color: var(--muted); text-decoration: none; font-size: 11px; border-radius: 8px; text-align: center; line-height: 1.15; }
.dock a[aria-current="page"] { color: var(--primary); }
.dock a[aria-current="page"] .ic { filter: drop-shadow(0 0 6px rgba(0,210,211,.5)); }
#toast { position: fixed; left: 0; right: 0; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); z-index: 6; display: grid; justify-items: center; pointer-events: none; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
#toast div { background: var(--s-top); color: var(--ink); border: 1px solid var(--primary); padding: 9px 14px; border-radius: 6px; font-size: 13px; max-width: 420px; box-shadow: 0 20px 48px rgba(0,0,0,.6); }
@media (prefers-reduced-motion: no-preference) {
  .live .dot { animation: ping 2s ease-in-out infinite; }
  @keyframes ping { 50% { opacity: .35; } }
}
</style>

<div class="app">
  <header class="appbar">
    <a class="brand" href="#tanks" aria-label="PetMe home">
      <span class="mark" id="brandMark"></span>
      <span>PetMe<small class="live" id="syncLine"><span class="dot"></span><span id="syncText">Connecting</span></small></span>
    </a>
    <div class="avatar" title="Your account">Me</div>
  </header>

  <main id="v-tanks" class="view"></main>
  <main id="v-book" class="view" hidden></main>
  <main id="v-history" class="view" hidden></main>
  <main id="v-livestock" class="view" hidden></main>
  <main id="v-pro" class="view" hidden></main>
</div>

<div class="dock"><nav aria-label="Main" id="dock"></nav></div>
<div id="toast" aria-live="polite"></div>

<script>

  "use strict";
